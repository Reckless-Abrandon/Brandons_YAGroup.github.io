<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter 2026-27 Schedule | Brandon's Young Adults</title>
    <style>
        :root {
            /* Colors extracted to perfectly complement your winter flyer */
            --bg-color: #d2e4f9;        /* Soft winter sky blue background */
            --card-bg: #1c3254;        /* Deep navy slate from the flyer text/berries */
            --text-light: #ffffff;     /* Crisp white text for the card */
            --text-dark: #1c3254;      /* Deep navy for outside the card */
            --btn-bg: #f0f7ff;         /* Light frosty white for high-contrast buttons */
            --btn-text: #1c3254;       /* Deep navy for readable button text */
            --btn-hover: #a9cdf5;      /* Accent blue for button hover feedback */
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;  /* Fallback for older browsers */
            min-height: 100dvh; /* Dynamic height that respects mobile browser bars */
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 45px 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(28, 50, 84, 0.25);
            margin: auto 0;
        }

        .subtitle {
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--btn-hover);
            margin-bottom: 12px;
            font-weight: 700;
        }

        h1 {
            color: var(--text-light);
            font-size: 1.7rem;
            line-height: 1.4;
            margin-bottom: 35px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: block;
            padding: 16px 20px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease-in-out;
        }

        .btn:hover {
            background-color: var(--btn-hover);
            color: var(--card-bg);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .footer {
            color: var(--text-light);
            margin-top: 35px;
            font-size: 0.85rem;
            opacity: 0.7;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="subtitle">Winter 2026-27 Schedule</div>
        <h1>BRANDON'S YOUNG ADULTS GROUP</h1>
        
        <div class="links-wrapper">
            <!-- Swap out the '#' symbols below with your actual website URLs -->
            <a href="https://calendar.google.com/calendar/embed?src=1dbc31ea1d5c216062fecc48e6f82eaa78e5b97c2b4893c7ddada583e5e00d24%40group.calendar.google.com&ctz=America%2FAnchorage" target="_blank" class="btn">📅 Google Calendar</a>
            <a href="https://calendar.google.com/calendar/ical/1dbc31ea1d5c216062fecc48e6f82eaa78e5b97c2b4893c7ddada583e5e00d24%40group.calendar.google.com/public/basic.ics" target="_blank" class="btn">🗓️ Other Calendar</a>
            <a href="https://abbottloopcommunity.churchcenter.com/groups/small-groups/brandon-s-young-adults-group" target="_blank" class="btn">👥 Group Page</a>
        </div>

        <div class="footer">
            Click to import calendar or visit group page!
        </div>
    </div>

</body>
</html>
