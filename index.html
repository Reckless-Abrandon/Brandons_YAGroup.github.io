<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter 2026-27 Schedule | Brandon's Young Adults</title>
    <style>
        :root {
            --bg-color: #121824;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --btn-hover: #0ea5e9;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--accent-color);
            margin-bottom: 10px;
            font-weight: 700;
        }

        h1 {
            font-size: 1.8rem;
            line-height: 1.3;
            margin-bottom: 30px;
            font-weight: 800;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;
            padding: 16px 20px;
            background-color: transparent;
            color: var(--text-color);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            border: 2px solid var(--accent-color);
            transition: all 0.2s ease-in-out;
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="subtitle">Winter 2026-27 Schedule</div>
        <h1>BRANDON'S YOUNG ADULTS GROUP</h1>
        
        <div class="links-wrapper">
            <!-- BUTTON 1: Swap out '#' with your actual link -->
            <a href="https://calendar.google.com/calendar/embed?src=1dbc31ea1d5c216062fecc48e6f82eaa78e5b97c2b4893c7ddada583e5e00d24%40group.calendar.google.com&ctz=America%2FAnchorage" target="_blank" class="btn">📅 View Calendar Schedule</a>
            
            <!-- BUTTON 2: Swap out '#' with your actual link -->
            <a href="https://calendar.google.com/calendar/ical/1dbc31ea1d5c216062fecc48e6f82eaa78e5b97c2b4893c7ddada583e5e00d24%40group.calendar.google.com/public/basic.ics" target="_blank" class="btn">💬 Join the Group Chat</a>
            
            <!-- BUTTON 3: Swap out '#' with your actual link -->
            <a href="https://abbottloopcommunity.churchcenter.com/groups/small-groups/brandon-s-young-adults-group" target="_blank" class="btn">📍 Meeting Location & Info</a>
        </div>

        <div class="footer">
            Scan for updates • See you there!
        </div>
    </div>

</body>
</html>
